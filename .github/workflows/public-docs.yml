name: Public documentation

on:
  pull_request:
    paths:
      - "**.md"
      - "site/**"
      - "scripts/validate_public_docs.py"
      - ".github/workflows/public-docs.yml"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "site/**"
      - "scripts/validate_public_docs.py"
      - ".github/workflows/public-docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public documentation
        run: python scripts/validate_public_docs.py
